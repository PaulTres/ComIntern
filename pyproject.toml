[project]
name = "comintern"
version = "0.1.0"
description = "Compliance readiness assistant for companies in the EU, Germany and Romania"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "deepagents>=0.7.28",
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
comintern = "comintern.main:main"
comintern-seed = "comintern.seed:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.build-backend]
module-name = "comintern"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = [".claude", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
